name: "Bug Fix (AI-Optimized)"
description: Report a bug with precise context for AI agents.
title: "fix: [Short description of the bug]"
labels: ["Bug", "AI"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Problem Summary
        Provide a clear description of what is broken.
  - type: textarea
    id: context
    attributes:
      label: 📍 Exact Context
      description: Specify paths, functions, and environment details.
      placeholder: |
        - Affected File(s): src/path/to/file.ext
        - Function Name: functionName()
        - Environment: Node.js v24 / React v19
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: 🛑 Current Behavior & Logs
      description: Paste exact error messages or stack traces here.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 🟢 Expected Behavior
      description: What should the system do instead?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria for AI
      description: Checklist for the AI agent to consider the job done.
      value: |
        - [ ] The error no longer occurs.
        - [ ] Unit tests pass successfully.
